<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oppy: Mars Rover — Zhuri Solan</title>
  <meta name="description" content="Oppy: Mars Rover, a children's storybook of NASA's robotic rover Opportunity." />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <script>(function(){var t=localStorage.getItem('theme'),p=window.matchMedia('(prefers-color-scheme: dark)').matches;if(t==='dark'||(t===null&&p))document.documentElement.setAttribute('data-theme','dark');})();</script>
</head>
<body>

  <header id="site-nav"></header>

  <main>
    <section class="page-section page-section--hero">
      <div class="container container--narrow">
        <a href="../index.html" class="link-accent" style="font-size: var(--text-sm); display: inline-block; margin-bottom: var(--space-6);">
          ← Go Back
        </a>
        <h1 style="font-family: var(--font-display); font-size: clamp(3rem, 8vw, 6rem); font-weight: var(--weight-black); letter-spacing: -0.02em; line-height: 0.92; text-transform: uppercase; color: var(--color-purple); margin-bottom: var(--space-4);">
          Oppy: Mars Rover
        </h1>
        <p class="hero-sub">
          A children's storybook of NASA's robotic rover Opportunity.
        </p>
      </div>
    </section>

    <section class="page-section" style="padding-top: 0;">
      <div class="container">
        <div class="case-layout">

          <div>
            <div class="case-card">
              <h2>Overview</h2>
              <div class="prose">
                <p>
                  A children's storybook on the life of Opportunity, a planetary rover active on Mars from 2004 until 2018. Made using Illustrator. Assembled in InDesign.
                </p>
              </div>
            </div>
          </div>

          <!-- Main photo -->
          <div class="case-media-main">
            <img src="../assets/images/real+life+Oppy+book.png" alt="Printed copy of the Oppy: Mars Rover storybook" />
          </div>

        </div>

      </div>
    </section>

    <section class="page-section" style="padding-top: 0;">
      <div class="container container--narrow">
        <div class="book-viewer">
          <button type="button" class="book-viewer__arrow" id="book-prev" aria-label="Previous page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>

          <div class="book-viewer__stage">
            <img id="book-page-img" src="../assets/images/Oppy+title+page.webp" alt="Oppy Title Page" />
          </div>

          <button type="button" class="book-viewer__arrow" id="book-next" aria-label="Next page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        <p class="book-viewer__caption" id="book-page-caption">1 / 10</p>
      </div>
    </section>
  </main>

  <script src="../assets/js/nav.js"></script>
  <script>
    (function () {
      var pages = [
        { src: '../assets/images/Oppy+title+page.webp'},
        { src: '../assets/images/Hi+Im+Oppy.webp'},
        { src: '../assets/images/Sometime+its+dusty.png'},
        { src: '../assets/images/steep+hill+mars+rover.png'},
        { src: '../assets/images/stuck+oppy+is.png'},
        { src: '../assets/images/Marathon+Valley.webp'},
        { src: '../assets/images/dust+storm+fuck+ye.png'},
        { src: '../assets/images/Gleaner+page.png', objectFit: 'cover', objectPosition: '-50% center'},
        { src: '../assets/images/Last+page+mars.webp'},
        { src: '../assets/images/back+cover.webp'}
      ];

      var index = 0;
      var img = document.getElementById('book-page-img');
      var caption = document.getElementById('book-page-caption');

      function render() {
        var page = pages[index];
        img.src = page.src;
        img.alt = 'Storybook page ' + (index + 1);
        img.style.objectFit = page.objectFit || 'contain';
        img.style.objectPosition = page.objectPosition || 'center';
        caption.textContent = (index + 1) + ' / ' + pages.length;
      }

      document.getElementById('book-prev').addEventListener('click', function () {
        index = (index - 1 + pages.length) % pages.length;
        render();
      });

      document.getElementById('book-next').addEventListener('click', function () {
        index = (index + 1) % pages.length;
        render();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') document.getElementById('book-prev').click();
        if (e.key === 'ArrowRight') document.getElementById('book-next').click();
      });
    })();
  </script>
</body>
</html>
